# Один бот — один контейнер. Настройки и база знаний свои у каждого клиента:
#   ENV_FILE=clients/kadr/.env KNOWLEDGE_DIR=clients/kadr/knowledge docker compose -p kadr up -d --build
# Статистика в Postgres включается вторым файлом, см. docker-compose.stats.yml.
services:
  app:
    build: .
    env_file:
      - ${ENV_FILE:-.env}
    volumes:
      # База знаний монтируется, а не вшивается в образ: /reload подхватывает правки
      # без пересборки. Запись нужна для ответов, которые владелец одобрил для базы;
      # больше бот на диск хоста ничего не пишет.
      - ${KNOWLEDGE_DIR:-./knowledge}:/app/knowledge
    restart: on-failure
